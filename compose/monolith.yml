# Monolith stack — DT Orch single VM PoC / small self-host.
# Customer:  scripts/install.sh monolith
# Dev build:  docker compose -f compose/monolith.yml -f compose/docker-compose.dev.yml up -d --build
#
# Profiles: full | backend | frontend | auth | ollama | agent

name: dt-orch

x-api-env: &api-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL}
  WORKSPACE_DATABASE_URL: ${WORKSPACE_DATABASE_URL:-postgresql://elt:changeme@postgres:5432/dtorc_workspace}
  WORKSPACE_SQL_ENGINE: ${WORKSPACE_SQL_ENGINE:-postgres}
  WORKSPACE_MONGO_URL: ${WORKSPACE_MONGO_URL:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  KC_SERVER_URL: ${KC_SERVER_URL}
  KC_ISSUER: ${KC_ISSUER:-}
  KC_JWKS_URL: ${KC_JWKS_URL:-}
  KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
  KC_REALM: ${KC_REALM:-}
  KC_DEV_REALM: ${KC_DEV_REALM}
  KC_WEB_CLIENT_ID: ${KC_WEB_CLIENT_ID:-workspace-web}
  KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
  KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
  KC_API_CLIENT_ID: ${KC_API_CLIENT_ID:-${KC_ADMIN_CLIENT_ID}}
  KC_API_CLIENT_SECRET: ${KC_API_CLIENT_SECRET:-${KC_ADMIN_CLIENT_SECRET}}
  SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
  SCRAPER_SERVICE_URL: ${SCRAPER_SERVICE_URL:-http://scraper-service:8080}
  SCRAPER_INTERNAL_TOKEN: ${SCRAPER_INTERNAL_TOKEN:-}
  PLATFORM_INFRA_URL: ${PLATFORM_INFRA_URL:-http://infra-service:9000}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-token}
  FERNET_KEY: ${FERNET_KEY:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  LICENSE_PUBLIC_KEY_PATH: /etc/dt-orch/license-public.pem
  SHARED_MINIO_ENDPOINT: ${SHARED_MINIO_ENDPOINT:-http://platform-shared-minio-storage:9000}
  SHARED_MINIO_ACCESS_KEY: ${SHARED_MINIO_ACCESS_KEY:-minioadmin}
  SHARED_MINIO_SECRET_KEY: ${SHARED_MINIO_SECRET_KEY:-minioadmin}
  SHARED_STORAGE_BUCKET: ${SHARED_STORAGE_BUCKET:-data}
  CENTRIFUGO_DEFAULT_API_URL: ${CENTRIFUGO_DEFAULT_API_URL:-http://centrifugo:8000}
  CENTRIFUGO_DEFAULT_WS_URL: ${CENTRIFUGO_DEFAULT_WS_URL:-ws://centrifugo:8000/connection/websocket}
  CENTRIFUGO_DEFAULT_API_KEY: ${CENTRIFUGO_DEFAULT_API_KEY:-}
  CENTRIFUGO_DEFAULT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_DEFAULT_TOKEN_HMAC_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: elt-postgres
    restart: unless-stopped
    profiles: [full, backend, auth]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # Use bootstrap DB `postgres` — app DBs are created by init-db.sql on first start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elt} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - elt-net

  mysql:
    image: mysql:8.4
    container_name: elt-mysql
    restart: unless-stopped
    profiles: [workspace-mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dtorc_workspace}
      MYSQL_USER: ${MYSQL_USER:-${POSTGRES_USER:-elt}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - elt-net
      - data-plane-net

  mongo:
    image: mongo:7
    container_name: elt-mongo
    restart: unless-stopped
    profiles: [workspace-mongo]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-elt}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-dtorc_mongo}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - elt-net
      - data-plane-net

  redis:
    image: redis:7.2-alpine
    container_name: elt-redis
    restart: unless-stopped
    profiles: [full, backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - elt-net

  # Shared BaaS object storage — one platform MinIO for all projects (bucket per project).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    container_name: platform-shared-minio-storage
    restart: unless-stopped
    profiles: [full, backend]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SHARED_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SHARED_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - elt-net
      - data-plane-net

  # Shared BaaS realtime broker — one Centrifugo; isolate projects via channel ACLs.
  centrifugo:
    image: ${CENTRIFUGO_IMAGE:-centrifugo/centrifugo:v5.4.9}
    container_name: platform-shared-centrifugo
    restart: unless-stopped
    profiles: [full, backend]
    command: centrifugo --health
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_DEFAULT_TOKEN_HMAC_SECRET_KEY:-changeme-centrifugo-hmac}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_DEFAULT_API_KEY:-changeme-centrifugo-api-key}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-admin}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-admin-secret}
      CENTRIFUGO_ALLOWED_ORIGINS: "*"
      CENTRIFUGO_HEALTH: "true"
      CENTRIFUGO_PORT: "8000"
    ports:
      - "${CENTRIFUGO_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - elt-net
      - data-plane-net

  api:
    image: ${API_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/dt-orch-api:v1.0.0}
    container_name: dt-orch-api
    restart: unless-stopped
    profiles: [full, backend]
    entrypoint: ["/bin/sh", "/opt/migrate-fix/api-entrypoint-fresh-install.sh"]
    env_file: ${ENV_FILE:-../.env}
    environment:
      <<: *api-env
    volumes:
      - backend_logs:/app/logs
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/config/license-public.pem:/etc/dt-orch/license-public.pem:ro
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/scripts/fix-fresh-migrate.sh:/opt/migrate-fix/fix-fresh-migrate.sh:ro
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/scripts/api-entrypoint-fresh-install.sh:/opt/migrate-fix/api-entrypoint-fresh-install.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
      scraper-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - elt-net
      - data-plane-net

  infra-service:
    image: ${INFRA_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/baas-infra:v1.0.0}
    container_name: baas-infra-service
    restart: unless-stopped
    profiles: [full, backend]
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-token}
      # local = shared SQL for Studio DBs (schemas). Do not default to docker
      # (that spawned ws-*-postgres-db containers per project).
      PROVISION_MODE: ${PROVISION_MODE:-local}
      DATA_PLANE_NETWORK: ${DATA_PLANE_NETWORK:-data-plane-net}
      LOCAL_POSTGRES_URL: postgresql://${POSTGRES_USER:-elt}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${DTORC_WORKSPACE_DB_NAME:-dtorc_workspace}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - infra_instances:/app/data/instances
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "${INFRA_SERVICE_PORT:-9100}:9000"
    networks:
      - elt-net
      - data-plane-net

  scraper-service:
    image: ${SCRAPER_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/dt-orch-scraper:v1.0.0}
    container_name: dt-orch-scraper
    restart: unless-stopped
    profiles: [full, backend]
    environment:
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-30}
      SCRAPER_VERIFY_URL: ${SCRAPER_VERIFY_URL:-}
      SCRAPER_INTERNAL_TOKEN: ${SCRAPER_INTERNAL_TOKEN:-}
    ports:
      - "${SCRAPER_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - elt-net

  worker:
    image: ${API_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/dt-orch-api:v1.0.0}
    container_name: dt-orch-worker
    restart: unless-stopped
    profiles: [full, backend]
    command: celery -A core.celery_app.celery_app worker --loglevel=info -Q celery,notifications
    env_file: ${ENV_FILE:-../.env}
    environment:
      <<: *api-env
    volumes:
      - backend_logs:/app/logs
    tmpfs:
      - /tmp:size=256M,noexec
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A core.celery_app.celery_app inspect ping --timeout 10 2>&1 | grep -qi pong",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - elt-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: elt-keycloak
    restart: unless-stopped
    profiles: [full, auth]
    command: start-dev
    env_file: ${ENV_FILE:-../.env}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-elt}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - elt-net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/dt-orch-frontend:v1.0.0}
    container_name: dt-orch-frontend
    restart: unless-stopped
    profiles: [full, frontend]
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Loopback only — nginx (:80) is the public entry. Avoids conflict with setup wizard on :3000.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    networks:
      - elt-net

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: elt-ollama
    restart: unless-stopped
    profiles: [ollama]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - elt-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  proxy:
    image: nginx:1.27-alpine
    container_name: elt-proxy
    restart: unless-stopped
    profiles: [full]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/nginx/ssl.conf.template:/etc/nginx/ssl.conf.template:ro
      - ${ETL_DEPLOYMENT_HOST_ROOT:?Set ETL_DEPLOYMENT_HOST_ROOT}/scripts/proxy-entrypoint.sh:/docker-entrypoint.d/40-enable-ssl.sh:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - elt-net

networks:
  # Explicit names so they match DATA_PLANE_NETWORK / role compose (not dt-orch_*).
  elt-net:
    name: elt-net
    driver: bridge
  data-plane-net:
    name: data-plane-net
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  backend_logs:
  ollama_data:
  infra_instances:
  minio_data:
