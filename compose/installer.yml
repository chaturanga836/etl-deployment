# DT Orch setup wizard — run before the platform is installed.
# Listens on 0.0.0.0:9080 by default (set INSTALLER_BIND / INSTALLER_PORT).

services:
  installer:
    build:
      context: ..
      dockerfile: installer/Dockerfile
    container_name: dt-orch-installer
    ports:
      - "${INSTALLER_BIND:-0.0.0.0}:${INSTALLER_PORT:-9080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/opt/etl-deployment:ro
      - installer_state:/opt/etl-deployment-state
    environment:
      ETL_DEPLOYMENT_ROOT: /opt/etl-deployment
      INSTALLER_STATE_DIR: /opt/etl-deployment-state
      LICENSE_PUBLIC_KEY_PATH: /opt/etl-deployment/config/license-public.pem
      LICENSE_PRIVATE_KEY_PATH: /opt/etl-deployment/config/license-private.pem
      INSTALLER_PORT: ${INSTALLER_PORT:-9080}
    restart: unless-stopped

volumes:
  installer_state:
