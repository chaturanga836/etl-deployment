# Frontend + nginx proxy role.

name: dt-orch-role-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/YOUR_GITHUB_ORG/dt-orch-frontend:v1.0.0}
    container_name: dt-orch-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - elt-net

  proxy:
    image: nginx:1.27-alpine
    container_name: dt-orch-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/ssl.conf.template:/etc/nginx/templates/ssl.conf.template:ro
      - ../../scripts/proxy-entrypoint.sh:/docker-entrypoint.d/40-enable-ssl.sh:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
    networks:
      - elt-net

networks:
  elt-net:
    external: true
    name: elt-net
