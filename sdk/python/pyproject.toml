[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtorch-sdk"
version = "0.2.0"
description = "Python SDK for the DT Orch platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.0"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]
realtime = ["centrifuge-python>=0.3.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dtorch*", "elt_sdk*"]
