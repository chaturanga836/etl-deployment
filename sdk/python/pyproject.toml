[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-sdk"
version = "0.1.0"
description = "HTTP client for the ELT Engine API (Studio, workspaces, auth)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.0"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["elt_sdk*"]
