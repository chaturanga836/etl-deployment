[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtorch-cli"
version = "0.1.0"
description = "CLI for Dtorch database migrations (Supabase-style workflow)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "tomli-w>=1.0.0",
    "httpx>=0.28.0",
    "dtorch-sdk>=0.2.0",
    "python-dotenv>=1.0.0",
]
license = { text = "MIT" }

[project.scripts]
dtorch = "dtorch_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtorch_cli*"]
