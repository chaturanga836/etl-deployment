# Self-host entrypoint — delegates to compose/monolith.yml (+ optional monitoring overlay)
# Customer:  ./scripts/install.sh monolith
# Dev build:  docker compose -f compose/monolith.yml -f compose/docker-compose.dev.yml --profile full up -d --build
# Monitoring: add --profile monitoring (or EXTRA_COMPOSE_PROFILES=monitoring)

include:
  - path: compose/monolith.yml
  - path: compose/monitoring.yml
