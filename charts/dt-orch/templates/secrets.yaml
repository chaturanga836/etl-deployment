apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dt-orch.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken is required" .Values.secrets.internalServiceToken | quote }}
  FERNET_KEY: {{ .Values.secrets.fernetKey | quote }}
  KC_ADMIN_CLIENT_SECRET: {{ .Values.secrets.kcAdminClientSecret | quote }}
  KC_API_CLIENT_SECRET: {{ .Values.secrets.kcAdminClientSecret | quote }}
  DATABASE_URL: {{ required "database.url is required" .Values.database.url | quote }}
  REDIS_URL: {{ required "redis.url is required" .Values.redis.url | quote }}
  LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  INSTALL_BOOTSTRAP_TOKEN: {{ .Values.secrets.installBootstrapToken | quote }}
