apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dt-orch.fullname" . }}-frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "dt-orch.frontendImage" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dt-orch.fullname" . }}-frontend
spec:
  selector:
    app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      name: http
