apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dt-orch.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ include "dt-orch.apiImage" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: {{ include "dt-orch.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "dt-orch.fullname" . }}-api-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dt-orch.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "dt-orch.fullname" . }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
