{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elt-platform.fullname" . }}-migrate
  labels:
    app.kubernetes.io/name: {{ include "elt-platform.fullname" . }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "elt-platform.apiImage" . }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ include "elt-platform.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "elt-platform.fullname" . }}-api-config
{{- end }}
